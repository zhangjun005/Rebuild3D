<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>illust3d · 点画印刷</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #1b1a17;
        --paper: #f2ece1;
        --ui-bg: rgba(24, 23, 21, 0.82);
        --ui-fg: #e9e2d6;
        --ui-dim: #9a9388;
        --ui-accent: #d8a24a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101010;
        font: 13px/1.45 ui-sans-serif, system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: var(--ui-fg);
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 268px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 10px 12px 12px;
        border-radius: 10px;
        background: var(--ui-bg);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.08);
        user-select: none;
      }
      #panel.hidden {
        display: none;
      }
      #panel h1 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ui-accent);
      }
      #panel h1 small {
        display: block;
        margin-top: 2px;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--ui-dim);
        font-size: 11px;
      }
      .presets {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .presets button {
        flex: 1;
        padding: 5px 4px;
        font-size: 11px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ui-fg);
        cursor: pointer;
      }
      .presets button.active {
        border-color: var(--ui-accent);
        color: var(--ui-accent);
        background: rgba(216, 162, 74, 0.14);
      }
      .row {
        margin: 6px 0;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--ui-dim);
        margin-bottom: 3px;
      }
      .row label output {
        color: var(--ui-fg);
        font-variant-numeric: tabular-nums;
      }
      .row input[type='range'] {
        width: 100%;
        height: 15px;
        accent-color: var(--ui-accent);
        margin: 0;
      }
      .row.check {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .row.check input {
        accent-color: var(--ui-accent);
        margin: 0;
      }
      .row.check span {
        font-size: 11.5px;
        color: var(--ui-fg);
      }
      .row.color {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11.5px;
      }
      .row.color input[type='color'] {
        width: 46px;
        height: 20px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        background: none;
      }
      hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        margin: 8px 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 10px;
        padding: 6px 9px;
        border-radius: 8px;
        background: rgba(16, 16, 16, 0.78);
        color: #cfc7ba;
        font: 11px/1.4 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #hud b {
        color: var(--ui-fg);
        font-weight: 600;
      }
      .hint {
        margin-top: 8px;
        font-size: 10.5px;
        color: var(--ui-dim);
      }

      /* ── 导出区 ── */
      .export-title {
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--ui-accent);
        margin: 0 0 7px;
      }
      .row.select {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 6px 0;
        font-size: 11.5px;
        color: var(--ui-fg);
      }
      .row.select select {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        font-size: 11px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--ui-fg);
      }
      .export-buttons {
        display: flex;
        gap: 6px;
        margin: 9px 0 7px;
      }
      .export-buttons button {
        flex: 1;
        padding: 6px 3px;
        font-size: 10.5px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: var(--ui-fg);
        cursor: pointer;
      }
      .export-buttons button:hover:not(:disabled) {
        border-color: var(--ui-accent);
        color: var(--ui-accent);
      }
      .export-buttons button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .export-status {
        min-height: 15px;
        font-size: 10.5px;
        line-height: 1.5;
        color: var(--ui-dim);
        white-space: pre-wrap;
      }
      #panel.busy {
        opacity: 0.8;
      }

      /* 录制时把画布按输出比例居中显示（画布内容才是被录下来的东西） */
      body.capturing #view {
        inset: auto;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="panel"></aside>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
